[package]
name = "next_tablet_driver-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Its own workspace: the fuzz crate is built by cargo-fuzz with nightly, apart from the main one.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.ntd-core]
path = "../../crates/ntd-core"

[dependencies.ntd-tablets]
path = "../../crates/ntd-tablets"

[dependencies.ntd-interop]
path = "../../crates/ntd-interop"

[[bin]]
name = "rotate_point"
path = "fuzz_targets/rotate_point.rs"
test = false
doc = false
bench = false

