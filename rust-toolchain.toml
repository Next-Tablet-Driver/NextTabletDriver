[toolchain]
channel = "stable"
targets = [
    # Windows
    "x86_64-pc-windows-msvc",    # x64
    "i686-pc-windows-msvc",      # x86 (32 bits)
    "aarch64-pc-windows-msvc",   # ARM64 (need `MSVC v143 ARM64 build tools` to build)

    # Linux (via CI or WSL, NOT Windows)
    "x86_64-unknown-linux-gnu",
    "i686-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",

    # macOS
    # "x86_64-apple-darwin",
    # "aarch64-apple-darwin",
]
