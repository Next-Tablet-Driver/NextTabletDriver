[package]
name = "next_tablet_driver"
authors = ["iSweat <https://github.com/iSweat-exe>"]
description = "Tablet Driver for Osu! and Drawing"
repository = "https://github.com/Next-Tablet-Driver/NextTabletDriver"
version = "1.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
keywords = ["tablet", "driver", "rust", "osu"]
categories = ["hardware-support", "gui"]
rust-version = "1.97.1"

[dependencies]
# Windows & Linux
hidapi = "2.6.3"
eframe = "0.33.3"
display-info = "0.5.9"
enigo = "0.6.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
directories = "6.0.0"
rfd = "0.17.2"
log = "0.4"
chrono = "0.4"
egui_extras = { version = "0.33.3", features = ["http", "image"] }
egui-phosphor = "0.11"
crossbeam-channel = "0.5.15"
include_dir = "0.7"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
ureq = { version = "2.12.1", features = ["json"] }
catppuccin-egui = { version = "5.7.0", default-features = false, features = ["egui33"] }
tray-icon = "0.22.0"
sha2 = "0.10"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png"] }
uuid = { version = "1.23.3", features = ["v4", "serde"] }

# Windows
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media", "Win32_System_LibraryLoader", "Win32_System_SystemInformation"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
nix = { version = "0.29", features = ["sched", "fs"] }
libc = "0.2"
gtk = { version = "0.18.2", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
# debug = true
incremental = false

[lints.rust]
dead_code = "deny"
# missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
lossy_float_literal = "deny"

all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_to_numeric_cast_any = "warn"

cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
similar_names = "allow"
