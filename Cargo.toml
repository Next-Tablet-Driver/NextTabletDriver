[package]
name = "next_tablet_driver"
authors.workspace = true
description = "Tablet Driver for Osu! and Drawing"
repository.workspace = true
version = "3.0.0"
publish = false
edition.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[workspace]
members = [
    ".",
    "apps/desktop",
    "apps/sdk",
    "apps/sdk/examples/rust_plugin",
    "crates/ntd-core",
    "crates/ntd-hid",
    "crates/ntd-interop",
    "crates/ntd-pipeline",
    "crates/ntd-settings",
    "crates/ntd-platform",
    "crates/ntd-output",
    "crates/ntd-plugin-api",
    "crates/ntd-plugin-host",
    "crates/ntd-test-support",
    "crates/ntd-tablets",
    "plugins/*",
    "tools/ntd-codegen",
    "tools/ntd-recorder",
    "xtask",
]

[workspace.package]
# Metadata shared by every crate (`name.workspace = true`). `version` and `description` stay per
# crate. Plugins written by someone else keep their own `authors` and declare no licence.
authors = ["iSweat <https://github.com/iSweat-exe>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/Next-Tablet-Driver/NextTabletDriver"
# The oldest Rust that builds the project (not the version the CI uses).
rust-version = "1.99.0"
readme = "README.md"
keywords = ["tablet", "driver", "rust", "osu"]
categories = ["hardware-support"]

[workspace.dependencies]
# Every dependency version of the repository is declared here, once. A crate uses it with
# `name = { workspace = true }` and may add features or `optional = true`, never a version.
# In this repository
next_tablet_driver = { path = ".", default-features = false }
ntd-core = { path = "crates/ntd-core" }
ntd-hid = { path = "crates/ntd-hid" }
ntd-interop = { path = "crates/ntd-interop" }
ntd-output = { path = "crates/ntd-output" }
ntd-pipeline = { path = "crates/ntd-pipeline" }
ntd-platform = { path = "crates/ntd-platform" }
ntd-settings = { path = "crates/ntd-settings" }
ntd_plugin_api = { path = "crates/ntd-plugin-api" }
ntd-plugin-host = { path = "crates/ntd-plugin-host" }
ntd-tablets = { path = "crates/ntd-tablets" }
ntd-test-support = { path = "crates/ntd-test-support" }
# Third party
base64 = "0.23.1"
cargo-husky = { version = "1.5.0", default-features = false }
cbindgen = { version = "0.29", default-features = false }
chrono = "0.4"
criterion = "0.8"
crossbeam-channel = "0.5.15"
csbindgen = "1.9.8"
directories = "6.0.0"
display-info = "0.5.9"
evdev = "0.13"
hidapi = "2.6.3"
include_dir = "0.7"
interprocess = "2.2.3"
libc = "0.2"
libloading = "0.9"
log = { version = "0.4", features = ["std"] }
minisign = "0.10.0"
minisign-verify = "0.2"
nix = "0.31.3"
proptest = "1"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = "2.12.0"
tauri-build = "2.7.0"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-process = "2"
tauri-plugin-shell = "2.4.0"
tauri-plugin-updater = "2"
tauri-specta = "=2.0.0-rc.26"
thiserror = "2"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
ureq = "2.12.1"
uuid = "1.23.3"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
dead_code = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
# Groups.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Error handling: no external data may make the driver panic.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
lossy_float_literal = "deny"

# Output: everything goes through `log`.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# unsafe and FFI.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
uninit_assumed_init = "deny"
uninit_vec = "deny"
cast_ptr_alignment = "deny"
ptr_as_ptr = "deny"
fn_to_numeric_cast_any = "deny"

# Documentation.
missing_errors_doc = "deny"
missing_panics_doc = "deny"

# Every #[allow] must carry its justification: #[allow(lint, reason = "...")].
allow_attributes_without_reason = "deny"

# Exceptions, carried over from v2.
# HID reports mix u8/u16/i16/f32: the conversions are intended and bounded.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# x/y, tilt_x/tilt_y: close names are the domain vocabulary.
similar_names = "allow"
# Parsers are long flat `match`es over bytes; splitting them hurts readability.
too_many_lines = "allow"
assert_is_empty = "allow"
# Duplicate versions are handled by cargo-deny (bans) with a reviewed exception list.
multiple_crate_versions = "allow"
# Contradicts `unreachable_pub`: an item that is only used inside its crate is `pub(crate)`, even
# in a private module.
redundant_pub_crate = "allow"

[features]
default = ["desktop"]
# Everything that talks to the OS: HID polling thread and input injection.
# Disabled by the SDK, which embeds the pure processing pipeline only.
desktop = ["dep:ntd-output"]
# Derives `specta::Type` on the types the desktop shell exchanges with the frontend, so their
# TypeScript definitions are generated from Rust (roadmap P0.9).
specta = ["dep:specta", "ntd-core/specta", "ntd-settings/specta", "ntd-plugin-host/specta"]

[dependencies]
# Windows & Linux
ntd-hid = { workspace = true }
ntd-interop = { workspace = true }
ntd-output = { workspace = true, optional = true }
specta = { workspace = true, optional = true, features = ["serde_json"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
directories = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
crossbeam-channel = { workspace = true }
include_dir = { workspace = true }
tungstenite = { workspace = true }
ureq = { workspace = true, features = ["json"] }
uuid = { workspace = true, features = ["v4", "serde"] }
regex = { workspace = true }
ntd-core = { workspace = true }
ntd-plugin-host = { workspace = true }
ntd-pipeline = { workspace = true }
ntd-platform = { workspace = true }
ntd-settings = { workspace = true }
ntd-tablets = { workspace = true }

# Windows
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Devices_HumanInterfaceDevice", "Win32_System_Registry"] }

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["sched", "fs", "mman"] }
libc = { workspace = true }

[dev-dependencies]
ntd-test-support = { workspace = true }
cargo-husky = { workspace = true, features = ["user-hooks"] }
criterion = { workspace = true }
minisign = { workspace = true }
proptest = { workspace = true }

[[test]]
name = "transform_properties"
path = "qa/tests/transform_properties.rs"

[[test]]
name = "golden"
path = "qa/tests/golden.rs"

[[bench]]
name = "pipeline"
path = "qa/benches/pipeline.rs"
harness = false

[[bench]]
name = "transforms"
path = "qa/benches/transforms.rs"
harness = false

[[bench]]
name = "hot_path"
path = "qa/benches/hot_path.rs"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep unwinding: the engine relies on catch_unwind to survive a panic in a parser or
# filter, and FFI/plugin boundaries must not abort the whole app.
panic = "unwind"
strip = true
# debug = true
incremental = false

[lints]
workspace = true
