[package]
name = "ntd_sdk"
authors = ["iSweat <https://github.com/iSweat-exe>"]
description = "Native SDK for embedding NextTabletDriver's tablet engine in third-party applications"
repository = "https://github.com/Next-Tablet-Driver/NextTabletDriver"
version = "1.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[lib]
name = "ntd_sdk"
crate-type = ["cdylib", "staticlib"]

[dependencies]
next_tablet_driver = { path = "..", default-features = false }
hidapi = "2.6.3"
log = { version = "0.4", features = ["std"] }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
csbindgen = "1.9.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
incremental = false

[lints.rust]
dead_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
lossy_float_literal = "deny"

all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_to_numeric_cast_any = "warn"

cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
similar_names = "allow"
