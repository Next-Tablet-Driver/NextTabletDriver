[package]
name = "app"
version = "3.0.0"
publish = false
description = "Desktop shell of NextTabletDriver (Tauri)"
authors = ["iSweat <https://github.com/iSweat-exe>"]
license = "MIT"
repository = "https://github.com/Next-Tablet-Driver/NextTabletDriver"
edition = "2024"
rust-version = "1.99.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
next_tablet_driver = { path = "../..", features = ["specta"] }
ntd_plugin_api = { path = "../../crates/ntd-plugin-api" }
crossbeam-channel = "0.5"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-process = "2"
tauri-plugin-shell = "2.4.0"
specta = "=2.0.0-rc.26"
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }

# Debug builds reattach to the parent console (see src/main.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Same policy as the root crate (copied: this crate has its own lockfile).
[lints.rust]
dead_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
lossy_float_literal = "deny"

all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_to_numeric_cast_any = "warn"

cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
too_many_lines = "allow"
similar_names = "allow"
# Tauri passes `State` and command arguments by value; the `#[command]` signature requires it.
needless_pass_by_value = "allow"
