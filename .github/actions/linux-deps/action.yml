name: Linux system dependencies
description: >-
  The system libraries that building and testing the workspace needs on Linux: HID and udev, the
  X11 and GTK libraries behind the display and input code, and what Tauri (WebKitGTK) requires.

runs:
  using: composite
  steps:
    - name: Install the system libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config patchelf libudev-dev libxdo-dev libssl-dev \
          libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev libatk1.0-dev \
          libx11-dev libxrandr-dev libxfixes-dev libxrender-dev libx11-xcb-dev libxkbcommon-dev \
          libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
