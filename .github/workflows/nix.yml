name: Nix

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "frontend/package-lock.json"
      - "src-tauri/Cargo.lock"
      - "scripts/99-nexttabletdriver.rules"
      - ".github/workflows/nix.yml"
  pull_request:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "frontend/package-lock.json"
      - "src-tauri/Cargo.lock"
      - "scripts/99-nexttabletdriver.rules"
      - ".github/workflows/nix.yml"
  workflow_dispatch: {}

jobs:
  flake-check:
    name: Flake check (modules + devShell)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: nix flake check --all-systems -L

  build-package:
    name: Build package (nix build .#default)
    runs-on: ubuntu-latest
    # Known failure, non-blocking: nixpkgs ships rustc 1.98.x while the crate requires 1.99.0
    # (`rust-version` in Cargo.toml). Remove `continue-on-error` once nixpkgs has 1.99 or the
    # flake takes its toolchain from rust-overlay/fenix. The module checks above do not
    # depend on this job.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix build .#default
        run: nix build .#default -L

      - name: Verify udev rules were installed into the package
        run: test -f result/lib/udev/rules.d/99-nexttabletdriver.rules
