name: Nix

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "frontend/package-lock.json"
      - "Cargo.lock"
      - "scripts/99-nexttabletdriver.rules"
      - ".github/workflows/nix.yml"
  pull_request:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "frontend/package-lock.json"
      - "Cargo.lock"
      - "scripts/99-nexttabletdriver.rules"
      - ".github/workflows/nix.yml"
  workflow_dispatch: {}

jobs:
  flake-check:
    name: Flake check (modules + devShell)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: nix flake check --all-systems -L

  build-package:
    name: Build package (nix build .#default)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix build .#default
        # Flakes drop git submodules from the source unless asked: the tablet configurations
        # (tablets/OpenTabletDriver) are embedded at compile time.
        run: nix build "git+file://$PWD?submodules=1#default" -L

      - name: Verify udev rules were installed into the package
        run: test -f result/lib/udev/rules.d/99-nexttabletdriver.rules
