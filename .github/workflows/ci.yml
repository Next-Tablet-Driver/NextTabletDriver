name: CI

# Tests and quality, on every pull request and every push to main. A first job (`plan`) decides what
# to run from the files the change touches (`cargo xtask ci-plan`, docs/development.md); every other
# job reads its answer. A job that was skipped counts as passed in `ci-success`, the only check the
# branch ruleset requires.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Warnings fail the build. Cargo does not apply this to dependencies.
  RUSTFLAGS: -D warnings

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.plan.outputs.full }}
      any: ${{ steps.plan.outputs.any }}
      frontend: ${{ steps.plan.outputs.frontend }}
      crates: ${{ steps.plan.outputs.crates }}
      packages: ${{ steps.plan.outputs.packages }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The plan diffs against the base branch.
          fetch-depth: 0

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: plan
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref || 'main' }}
        run: cargo run --locked --quiet -p xtask -- ci-plan --base "origin/$BASE" --event "$EVENT"

  fmt:
    name: Format
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: cargo fmt
        run: cargo fmt --all --check

  style:
    name: Style (lint-style)
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: xtask
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo xtask lint-style
        run: cargo run --locked --quiet -p xtask -- lint-style

  typos:
    name: Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Spell check
        uses: crate-ci/typos@b41eb62e9a8096c9ba6636e2365d3f56018a203c # master

  machete:
    name: Unused dependencies
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-machete
      - name: cargo machete
        run: cargo machete

  clippy:
    name: Clippy
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features ${{ needs.plan.outputs.packages }} -- -D warnings

  clippy-release:
    name: Clippy (release)
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: clippy-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo clippy --release
        run: cargo clippy --locked --release --all-targets --all-features ${{ needs.plan.outputs.packages }} -- -D warnings

  doc:
    name: Documentation
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A few public docs link to private modules; everything else must be warning-free.
      RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: doc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo doc
        run: cargo doc --locked --no-deps --all-features ${{ needs.plan.outputs.packages }}

  test:
    name: Test (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ${{ matrix.os }}
    # A runner label that does not exist would queue forever: bound it.
    timeout-minutes: 60
    # The ARM64 runners of a full run are new and not verified yet: they may fail without failing
    # the workflow, until they have run green once (roadmap P1.15).
    continue-on-error: ${{ contains(matrix.name, 'ARM64') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: test-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: nextest
      - name: Run the tests
        run: cargo nextest run --locked --all-features ${{ needs.plan.outputs.packages }} --profile ci
      # nextest does not run doctests; the desktop app crate has none and breaks the linking of the
      # others when it is built with them, so only the root crate is checked.
      - name: Run the doctests
        if: contains(fromJson(needs.plan.outputs.crates), 'next_tablet_driver')
        run: cargo test --locked --all-features --doc -p next_tablet_driver -p ntd-core -p ntd-tablets -p ntd-pipeline
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  golden:
    name: Parser golden files
    needs: plan
    if: contains(fromJson(needs.plan.outputs.crates), 'next_tablet_driver')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: golden
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Every capture of qa/golden/ replayed through its parser, compared with its snapshot.
      - name: Golden files
        run: cargo test --locked -p next_tablet_driver --test golden

  codegen:
    name: Generated tablet tables
    needs: plan
    if: >-
      contains(fromJson(needs.plan.outputs.crates), 'ntd-codegen') ||
      contains(fromJson(needs.plan.outputs.crates), 'ntd-tablets') ||
      contains(fromJson(needs.plan.outputs.crates), 'next_tablet_driver')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: codegen
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Validates tablets/ and regenerates crates/ntd-tablets/src/generated/; any diff means the
      # committed tables are stale.
      - name: Regenerate
        run: cargo run --locked -p ntd-codegen
      - name: Fail on any difference
        run: git diff --exit-code -- crates/ntd-tablets/src/generated

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: plan
    if: >-
      contains(fromJson(needs.plan.outputs.crates), 'ntd-tablets') ||
      contains(fromJson(needs.plan.outputs.crates), 'ntd-core') ||
      contains(fromJson(needs.plan.outputs.crates), 'next_tablet_driver')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - parser_acepen
          - parser_bosto
          - parser_fallback
          - parser_floogoo
          - parser_genius
          - parser_huion
          - parser_lifetec
          - parser_robotpen
          - parser_skip_byte
          - parser_tenmoon
          - parser_uclogic
          - parser_veikk
          - parser_viewsonic
          - parser_wacom
          - parser_xencelabs
          - parser_xenx
          - parser_xp_pen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: nightly
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: qa/fuzz
          key: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz --version 0.13.2
      # 60 seconds per parser family, from the committed corpus. A crash fails the job and its
      # input is uploaded: it becomes a unit test and joins the corpus (qa/fuzz/README.md).
      - name: Fuzz
        # `+nightly`: rust-toolchain.toml pins stable, which has no sanitizers.
        run: cargo +nightly fuzz run ${{ matrix.target }} --fuzz-dir qa/fuzz -- -max_total_time=60
      - name: Upload the crashing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: qa/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  bindings:
    name: TypeScript bindings
    needs: plan
    if: contains(fromJson(needs.plan.outputs.crates), 'app')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: bindings
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The bindings are generated from the Rust commands, events and types. Fails when the
      # committed file differs from what the code generates; regenerate it with
      # `UPDATE_BINDINGS=1 cargo test -p app --test bindings`.
      - name: Bindings are up to date
        run: cargo test --locked -p app --test bindings

  bench:
    name: Benchmarks build
    needs: plan
    if: contains(fromJson(needs.plan.outputs.crates), 'next_tablet_driver')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Shared runners are too noisy to compare latencies against docs/perf-baseline.md (the 5 %
      # tolerance is checked by hand, on one machine); the benchmarks must at least compile.
      - name: Benchmarks compile
        run: cargo bench --locked --no-run -p next_tablet_driver

  example-plugins:
    name: Example plugins
    needs: plan
    if: contains(fromJson(needs.plan.outputs.crates), 'ntd_plugin_api') || contains(fromJson(needs.plan.outputs.crates), 'simple_smoothing')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: example-plugins
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The two example plugins in docs/plugin-development.md must keep working. Build both as
      # real libraries and check that each exports the seven functions every plugin needs, so a
      # change to the plugin interface cannot break them without the CI noticing.
      - name: Build the example plugins and check their exports
        run: |
          set -e
          cargo build --locked --release -p simple_smoothing
          cc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC apps/sdk/examples/c_plugin/plugin.c -o "$RUNNER_TEMP/libc_flip_x.so"

          # The seven functions that every plugin must export, in alphabetical order.
          expected="ntd_plugin_create ntd_plugin_destroy ntd_plugin_handshake ntd_plugin_manifest ntd_plugin_process ntd_plugin_reset ntd_plugin_set_property"

          for library in target/release/libsimple_smoothing.so "$RUNNER_TEMP/libc_flip_x.so"; do
            actual=$(nm -D --defined-only "$library" | awk '{print $3}' | grep '^ntd_plugin_' | sort | paste -sd' ' -)
            echo "$library exports: $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$library does not export exactly the seven plugin functions"
              exit 1
            fi
          done

  frontend:
    name: Frontend (format, types, lint, tests, build)
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Format
        run: npm --prefix frontend run format:check
      - name: Type-check
        run: npm --prefix frontend run check
      - name: Lint
        run: npm --prefix frontend run lint
      - name: Tests
        run: npm --prefix frontend run test -- --run
      - name: Build
        run: npm --prefix frontend run build

  # The real Svelte app in a browser, against the Tauri IPC mock (`/?mock` on the dev server):
  # every screen, without a tablet or a native window. Traces, screenshots and videos of the
  # failures are kept as an artifact.
  e2e:
    name: E2E (Playwright)
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        run: npm --prefix frontend run e2e
      - name: Upload the report and the traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Line coverage of the Rust code (production code only) and of the frontend, merged into one
  # report, with a floor for each (coverage-thresholds.json). Windows because that is where the
  # named-pipe, mutex and shared-memory code of the engine is compiled and tested.
  coverage:
    name: Coverage
    needs: plan
    if: needs.plan.outputs.any == 'true' || needs.plan.outputs.frontend == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: cargo-llvm-cov,nextest
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Rust coverage
        run: cargo llvm-cov nextest --locked -p next_tablet_driver -p ntd-core -p ntd-tablets -p ntd-pipeline -p ntd-platform --all-features --profile ci --lcov --output-path lcov.info
      - name: Frontend coverage
        run: npm --prefix frontend run test -- --run --coverage
      - name: Test the coverage gate
        run: python -m unittest scripts/test_coverage_gate.py
      - name: Enforce the coverage floors
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          status=0
          python scripts/coverage_gate.py --lcov lcov.info --frontend frontend/coverage/coverage-summary.json --markdown coverage.md || status=$?
          if [ -f coverage.md ]; then cat coverage.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status
      - name: Comment the report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        # Dependabot and forks get a read-only token: the report stays in the job summary.
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage.md', 'utf8');
            const marker = '<!-- coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-reports
          path: |
            lcov.info
            coverage.md
            frontend/coverage/lcov.info
            frontend/coverage/coverage-summary.json
          if-no-files-found: ignore
      - name: Fail when a floor is not met
        if: steps.gate.outcome == 'failure'
        run: exit 1

  # Compiles the whole desktop app (frontend + Rust) without bundling, so a broken release build
  # is caught on every pull request instead of on the day of a tag.
  build:
    name: Build the app (${{ matrix.os }})
    needs: plan
    if: contains(fromJson(needs.plan.outputs.crates), 'app') || needs.plan.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: System dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/linux-deps
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: build-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build app (no bundle)
        # The updater artifacts need the signing key, which is only available on releases.
        # `tauri/custom-protocol` embeds the frontend like a shipped build does; without it a
        # debug build loads the dev server URL, which the smoke test below could not reach.
        run: >
          node frontend/node_modules/@tauri-apps/cli/tauri.js build
          --debug --no-bundle --features tauri/custom-protocol
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Verify the app does not open a console window
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/assert-gui-subsystem.ps1 target/debug/app.exe
      # Smoke test of the app that was just built. Linux: driven through tauri-driver (WebDriver),
      # nothing is mocked, the Rust backend and the webview are the ones that ship. Windows: the
      # WebView2 runtime of the runners ignores the remote-debugging switch msedgedriver relies
      # on, so the script checks what it can without WebDriver (window shown, no console).
      - name: Install the WebDriver tooling (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get install -y webkit2gtk-driver xvfb
      - name: Cache tauri-driver
        if: startsWith(matrix.os, 'ubuntu')
        id: tauri-driver-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-v1
      - name: Install tauri-driver
        if: startsWith(matrix.os, 'ubuntu') && steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked
      - name: Smoke test the real app (Linux, WebDriver)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a npm --prefix frontend run e2e:native
      - name: Smoke test the real app (Windows, startup and window)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 target/debug/app.exe

  # Single required status check: the branch ruleset only has to know this name, so adding or
  # renaming jobs above never requires touching the ruleset. A skipped job counts as passed.
  ci-success:
    name: CI success
    if: always()
    needs:
      - plan
      - fmt
      - style
      - typos
      - machete
      - clippy
      - clippy-release
      - doc
      - test
      - golden
      - codegen
      - fuzz
      - bindings
      - bench
      - example-plugins
      - frontend
      - e2e
      - coverage
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every job that ran to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
