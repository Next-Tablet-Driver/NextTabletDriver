name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust Quality Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [1.99.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy,rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          # Only main writes the cache, pull requests just read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev libatk1.0-dev libx11-dev libxrandr-dev libxfixes-dev libxrender-dev libx11-xcb-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libfuse2 libxdo-dev

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Documentation
        if: matrix.os == 'ubuntu-latest'
        env:
          # A few public docs link to private modules; everything else must be warning-free.
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
        run: cargo doc --workspace --no-deps --all-features

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        run: cargo nextest run --workspace --all-features --profile ci

      # nextest does not run doctests.
      - name: Run doctests
        run: cargo test --workspace --all-features --doc

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The root crate is not a Cargo workspace, so `--workspace` above never reaches the
  # SDK, plugin API or the bundled plugins; check them explicitly.
  plugins:
    name: SDK, plugin API and bundled plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev libatk1.0-dev libx11-dev libxrandr-dev libxfixes-dev libxrender-dev libx11-xcb-dev libxkbcommon-dev libxdo-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            sdk/plugin_api
            sdk
            plugins/devocub_antichatter
            plugins/hand_speed
            plugins/hawku_smoothing
            plugins/kalman_smoothing
            plugins/radial_follow
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Check plugin API and plugins
        run: |
          set -e
          for manifest in sdk/plugin_api/Cargo.toml sdk/Cargo.toml plugins/*/Cargo.toml; do
            echo "::group::$manifest"
            cargo fmt --manifest-path "$manifest" -- --check
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            cargo nextest run --manifest-path "$manifest" --no-tests=pass
            echo "::endgroup::"
          done

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Type-check
        run: npm --prefix frontend run check

      - name: Tests
        run: npm --prefix frontend run test -- --run

      - name: Build
        run: npm --prefix frontend run build

  # The real Svelte app in a browser, against the Tauri IPC mock (`/?mock` on the dev server):
  # every screen, without a tablet or a native window. Traces, screenshots and videos of the
  # failures are kept as an artifact.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: npm --prefix frontend run e2e

      - name: Upload the report and the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Deterministic checks on the lockfiles (bans, licenses, sources). Security advisories are
  # checked by security.yml: a new advisory must not fail unrelated pull requests.
  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check every crate
        run: |
          set -e
          for manifest in Cargo.toml src-tauri/Cargo.toml sdk/Cargo.toml sdk/plugin_api/Cargo.toml plugins/*/Cargo.toml; do
            echo "::group::$manifest"
            cargo deny --manifest-path "$manifest" check bans licenses sources
            echo "::endgroup::"
          done

  # Compiles the whole desktop app (frontend + Rust) without bundling, so a broken
  # release build is caught on every PR instead of on the day of a tag.
  tauri:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libudev-dev libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Clippy (Tauri crate)
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build app (no bundle)
        # The updater artifacts need the signing key, which is only available on releases.
        # `tauri/custom-protocol` embeds the frontend like a shipped build does; without it a
        # debug build loads the dev server URL, which the smoke test below could not reach.
        run: >
          node frontend/node_modules/@tauri-apps/cli/tauri.js build
          --debug --no-bundle --features tauri/custom-protocol
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify the app does not open a console window
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/assert-gui-subsystem.ps1 src-tauri/target/debug/app.exe

      # Smoke test of the app that was just built, driven through tauri-driver (WebDriver):
      # nothing is mocked, the Rust backend and the webview are the ones that ship.
      - name: Install the WebDriver tooling (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get install -y webkit2gtk-driver xvfb

      - name: Cache tauri-driver
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/tauri-driver
            ~/.cargo/bin/tauri-driver.exe
            ~/.cargo/bin/msedgedriver-tool.exe
          key: webdriver-tools-${{ runner.os }}-v1

      - name: Install tauri-driver
        if: steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - name: Install msedgedriver-tool (Windows)
        if: runner.os == 'Windows' && steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/chippers/msedgedriver-tool

      - name: Install the Edge WebDriver matching the installed WebView2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH

      - name: Diagnose the app start (temporary)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "--- Edge policies"
          foreach ($key in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2', 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\ReleaseChannels') { if (Test-Path $key) { "$key"; Get-ItemProperty $key | Format-List } else { "$key absent" } }
          $app = (Resolve-Path src-tauri/target/debug/app.exe).Path
          $data = Join-Path $env:RUNNER_TEMP 'wv2data'
          $env:WEBVIEW2_USER_DATA_FOLDER = $data
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $p = Start-Process $app -PassThru
          Start-Sleep -Seconds 20
          "alive: $(-not $p.HasExited)"
          "--- data folder"
          if (Test-Path $data) { Get-ChildItem $data -Recurse -Depth 2 | Select-Object -First 25 FullName } else { "no data folder" }
          try { (Invoke-WebRequest http://127.0.0.1:9222/json/version -TimeoutSec 5).Content } catch { "devtools endpoint: $($_.Exception.Message)" }
          "--- webview2 processes"
          Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Select-Object -First 3 CommandLine | Format-List
          Get-Process app, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force

      - name: Smoke test the real app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a npm --prefix frontend run e2e:native
          else
            npm --prefix frontend run e2e:native
          fi

  # Single required status check: the branch ruleset only has to know this name, so
  # adding or renaming jobs above never requires touching the ruleset.
  ci-success:
    name: CI success
    if: always()
    needs: [rust, plugins, frontend, e2e, deny, tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
