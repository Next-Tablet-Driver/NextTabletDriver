name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs, from the files it changes. Each job runs only when a
  # file it builds or checks has changed: a change to the documentation runs none of them, a change
  # to the frontend does not build the Rust code, a change to a plugin does not build the app.
  # Pushes to main and manual runs always run everything. A skipped job counts as passed in
  # `ci-success`. When you add a folder that holds code, add it to the patterns below.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      root: ${{ steps.filter.outputs.root }}
      sdk: ${{ steps.filter.outputs.sdk }}
      frontend: ${{ steps.filter.outputs.frontend }}
      coverage: ${{ steps.filter.outputs.coverage }}
      tauri: ${{ steps.filter.outputs.tauri }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: Decide what to run
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          all() { for k in root sdk frontend coverage tauri deps; do emit "$k" true; done; }

          if [ "$EVENT" != "pull_request" ]; then
            all
            exit 0
          fi

          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if [ -z "$files" ]; then
            all
            exit 0
          fi

          # Files that cannot change what the code does: documentation, licences, templates.
          code=$(echo "$files" | grep -Ev '\.md$|^docs/|^licenses/|^LICENSE$|^\.github/(ISSUE_TEMPLATE/|CODEOWNERS|labeler\.yml|pull_request_template\.md)' || true)
          echo "Files that can change the code:"; echo "${code:-<none>}"

          match() { if echo "$code" | grep -Eq "$1"; then echo true; else echo false; fi; }

          # Shared by every Rust job: this workflow and the toolchain and lint configuration.
          common='^\.github/workflows/ci\.yml$|^(rust-toolchain|clippy|rustfmt)\.toml$|^\.cargo/'

          # What the root crate is built from: sources, the tablet definitions and locales it
          # embeds, and the plugin API it depends on. Tests and benchmarks (qa/) are added only
          # for the jobs that run them.
          built_from='^(src|tablets|resources)/|^crates/ntd-plugin-api/|^Cargo\.(toml|lock)$'

          # Rust quality check of the root crate.
          root=$(match "$built_from|^qa/|$common")

          # SDK, plugin API, plugins and examples. The SDK embeds the root crate, and this job also
          # checks the lint policy of every Cargo.toml.
          sdk=$(match "^(apps/sdk|crates|plugins|tools)/|^(src|tablets|resources)/|^Cargo\.lock$|(^|/)Cargo\.toml$|$common")

          # Frontend lint, types, unit tests and build; the E2E tests run on the same files. The
          # generated bindings are committed under frontend/, so they are covered.
          frontend=$(match "^frontend/|^\.github/workflows/ci\.yml$")

          # Coverage of the root crate and of the frontend, and the scripts that gate it.
          coverage=$(match "$built_from|^qa/|^frontend/|^coverage-thresholds\.json$|^scripts/(test_)?coverage_gate\.py$|$common")

          # The desktop app: its own crate, everything it embeds, and the build scripts it uses.
          tauri=$(match "$built_from|^(apps/desktop|frontend)/|^scripts/(99-nexttabletdriver\.rules|assert-gui-subsystem\.ps1|smoke-windows\.ps1)$|$common")

          # Dependency policy: any manifest or lockfile, and the policy itself.
          deps=$(match '(^|/)Cargo\.(toml|lock)$|^deny\.toml$|^\.github/workflows/ci\.yml$')

          emit root "$root"; emit sdk "$sdk"; emit frontend "$frontend"
          emit coverage "$coverage"; emit tauri "$tauri"; emit deps "$deps"

  rust:
    name: Rust Quality Check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        rust: [1.99.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy,rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
          # Only main writes the cache, pull requests just read it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev libatk1.0-dev libx11-dev libxrandr-dev libxfixes-dev libxrender-dev libx11-xcb-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libfuse2 libxdo-dev

      - name: Rustfmt check
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check -p next_tablet_driver --all-targets --all-features

      - name: Clippy
        run: cargo clippy -p next_tablet_driver --all-targets --all-features -- -D warnings

      - name: Documentation
        if: matrix.os == 'ubuntu-latest'
        env:
          # A few public docs link to private modules; everything else must be warning-free.
          RUSTDOCFLAGS: -D warnings -A rustdoc::private_intra_doc_links
        run: cargo doc -p next_tablet_driver --no-deps --all-features

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests
        run: cargo nextest run -p next_tablet_driver --all-features --profile ci

      # nextest does not run doctests.
      - name: Run doctests
        run: cargo test -p next_tablet_driver --all-features --doc

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  # The jobs above are limited to the root crate (`-p next_tablet_driver`): the workspace also holds
  # the desktop app, which needs the system libraries of the Tauri job. Check the SDK, the plugin
  # API, the bundled plugins and the example plugin explicitly here.
  plugins:
    name: SDK, plugin API, plugins and examples
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev libatk1.0-dev libx11-dev libxrandr-dev libxfixes-dev libxrender-dev libx11-xcb-dev libxkbcommon-dev libxdo-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: clippy,rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # Every crate still keeps its own copy of the lint policy until the shared
      # `[workspace.lints]` table exists (roadmap P1.6). Fail if a copy drops a rule.
      - name: Check that every crate keeps the lint policy
        run: |
          set -e
          for manifest in Cargo.toml apps/sdk/Cargo.toml crates/ntd-plugin-api/Cargo.toml apps/desktop/Cargo.toml plugins/*/Cargo.toml tools/ntd-recorder/Cargo.toml; do
            for rule in 'unwrap_used = "deny"' 'expect_used = "deny"' 'panic = "deny"' 'todo = "deny"' 'unimplemented = "deny"' 'exit = "deny"' 'pedantic = { level = "warn", priority = -1 }'; do
              if ! grep -qF "$rule" "$manifest"; then
                echo "::error file=$manifest::missing lint rule: $rule"
                exit 1
              fi
            done
          done

      - name: Check plugin API, plugins and the example plugin
        run: |
          set -e
          for manifest in crates/ntd-plugin-api/Cargo.toml apps/sdk/Cargo.toml plugins/*/Cargo.toml apps/sdk/examples/rust_plugin/Cargo.toml tools/ntd-recorder/Cargo.toml; do
            echo "::group::$manifest"
            cargo fmt --manifest-path "$manifest" -- --check
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            cargo nextest run --manifest-path "$manifest" --no-tests=pass
            echo "::endgroup::"
          done

      # The two example plugins in docs/plugin-development.md must keep working. Build both as
      # real libraries and check that each exports the seven functions every plugin needs, so a
      # change to the plugin interface cannot break them without the CI noticing.
      - name: Build the example plugins and check their exports
        run: |
          set -e
          cargo build --release --manifest-path apps/sdk/examples/rust_plugin/Cargo.toml
          cc -std=c11 -O2 -Wall -Wextra -Werror -shared -fPIC apps/sdk/examples/c_plugin/plugin.c -o "$RUNNER_TEMP/libc_flip_x.so"

          # The seven functions that every plugin must export, in alphabetical order.
          expected="ntd_plugin_create ntd_plugin_destroy ntd_plugin_handshake ntd_plugin_manifest ntd_plugin_process ntd_plugin_reset ntd_plugin_set_property"

          for library in target/release/libsimple_smoothing.so "$RUNNER_TEMP/libc_flip_x.so"; do
            actual=$(nm -D --defined-only "$library" | awk '{print $3}' | grep '^ntd_plugin_' | sort | paste -sd' ' -)
            echo "$library exports: $actual"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$library does not export exactly the seven plugin functions"
              exit 1
            fi
          done

  frontend:
    name: Frontend (lint, types, tests, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Type-check
        run: npm --prefix frontend run check

      - name: Tests
        run: npm --prefix frontend run test -- --run

      - name: Build
        run: npm --prefix frontend run build

  # The real Svelte app in a browser, against the Tauri IPC mock (`/?mock` on the dev server):
  # every screen, without a tablet or a native window. Traces, screenshots and videos of the
  # failures are kept as an artifact.
  e2e:
    name: E2E (Playwright)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        run: npm --prefix frontend run e2e

      - name: Upload the report and the traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Line coverage of the Rust code (production code only) and of the frontend, merged into one
  # report, with a floor for each (coverage-thresholds.json). Windows because that is where the
  # named-pipe, mutex and shared-memory code of the engine is compiled and tested.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Rust coverage
        run: cargo llvm-cov nextest -p next_tablet_driver --all-features --profile ci --lcov --output-path lcov.info

      - name: Frontend coverage
        run: npm --prefix frontend run test -- --run --coverage

      - name: Test the coverage gate
        run: python -m unittest scripts/test_coverage_gate.py

      - name: Enforce the coverage floors
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          status=0
          python scripts/coverage_gate.py             --lcov lcov.info             --frontend frontend/coverage/coverage-summary.json             --markdown coverage.md || status=$?
          if [ -f coverage.md ]; then cat coverage.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status

      - name: Comment the report on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        # Dependabot and forks get a read-only token: the report stays in the job summary.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage.md', 'utf8');
            const marker = '<!-- coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Upload the coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            lcov.info
            coverage.md
            frontend/coverage/lcov.info
            frontend/coverage/coverage-summary.json
          if-no-files-found: ignore

      - name: Fail when a floor is not met
        if: steps.gate.outcome == 'failure'
        run: exit 1

  # Deterministic checks on the lockfiles (bans, licenses, sources). Security advisories are
  # checked by security.yml: a new advisory must not fail unrelated pull requests.
  deny:
    name: Dependency policy (cargo-deny)
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # One workspace, one lockfile: a single run covers every crate.
      - name: Check every crate
        run: cargo deny check bans licenses sources

  # Compiles the whole desktop app (frontend + Rust) without bundling, so a broken
  # release build is caught on every PR instead of on the day of a tag.
  tauri:
    name: Tauri build (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libudev-dev libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Clippy (Tauri crate)
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo clippy --manifest-path apps/desktop/Cargo.toml --all-targets -- -D warnings

      # The TypeScript bindings are generated from the Rust commands, events and types. Fails when
      # the committed file differs from what the code generates; regenerate it with
      # `UPDATE_BINDINGS=1 cargo test -p app --test bindings`.
      - name: Bindings are up to date
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo test -p app --test bindings

      - name: Build app (no bundle)
        # The updater artifacts need the signing key, which is only available on releases.
        # `tauri/custom-protocol` embeds the frontend like a shipped build does; without it a
        # debug build loads the dev server URL, which the smoke test below could not reach.
        run: >
          node frontend/node_modules/@tauri-apps/cli/tauri.js build
          --debug --no-bundle --features tauri/custom-protocol
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify the app does not open a console window
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/assert-gui-subsystem.ps1 target/debug/app.exe

      # Smoke test of the app that was just built. Linux: driven through tauri-driver (WebDriver),
      # nothing is mocked, the Rust backend and the webview are the ones that ship. Windows: the
      # WebView2 runtime of the runners ignores the remote-debugging switch msedgedriver relies
      # on, so the script checks what it can without WebDriver (window shown, no console).
      - name: Install the WebDriver tooling (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get install -y webkit2gtk-driver xvfb

      - name: Cache tauri-driver
        if: startsWith(matrix.os, 'ubuntu')
        id: tauri-driver-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-v1

      - name: Install tauri-driver
        if: startsWith(matrix.os, 'ubuntu') && steps.tauri-driver-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - name: Smoke test the real app (Linux, WebDriver)
        if: startsWith(matrix.os, 'ubuntu')
        run: xvfb-run -a npm --prefix frontend run e2e:native

      - name: Smoke test the real app (Windows, startup and window)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1 target/debug/app.exe

  # Single required status check: the branch ruleset only has to know this name, so
  # adding or renaming jobs above never requires touching the ruleset.
  ci-success:
    name: CI success
    if: always()
    needs: [changes, rust, plugins, frontend, e2e, coverage, deny, tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job that ran to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # A job skipped because its files did not change counts as passed.
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
