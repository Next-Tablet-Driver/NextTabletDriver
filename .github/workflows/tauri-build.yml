name: Tauri Build Check

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch: {}

# Compiles the whole desktop app (frontend + Rust) without bundling, so a broken
# release build is caught on every PR instead of on the day of a tag.
jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libudev-dev libxdo-dev libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend lint, type-check and tests
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run check
          npm --prefix frontend run test -- --run

      - name: Clippy (Tauri crate)
        if: startsWith(matrix.os, 'ubuntu')
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build app (no bundle)
        # The updater artifacts need the signing key, which is only available on releases.
        run: >
          node frontend/node_modules/@tauri-apps/cli/tauri.js build
          --debug --no-bundle
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
