name: Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref_name:
        description: "Tag name to simulate (e.g. v1.0.0-test)"
        required: true
        default: "v0.0.0-test"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE (x64 & ARM64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build Rust Project (release)
        run: cargo build --release
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: Compile Inno Setup (x64)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=x64 /DBuildDir=..\..\target\release packaging/windows/installer.iss

      - name: Add ARM64 target
        run: rustup target add aarch64-pc-windows-msvc

      - name: Build Rust Project (ARM64)
        run: cargo build --release --target aarch64-pc-windows-msvc
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: Compile Inno Setup (ARM64)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DArch=arm64 /DBuildDir=..\..\target\aarch64-pc-windows-msvc\release packaging/windows/installer.iss

      - name: Calculate Checksums
        shell: pwsh
        run: |
          $files = @("user_mode_dist/Next_Tablet_Driver_Setup_x64.exe", "user_mode_dist/Next_Tablet_Driver_Setup_arm64.exe")
          foreach ($file in $files) {
              if (Test-Path $file) {
                  $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLower()
                  $name = Split-Path $file -Leaf
                  "$hash  $name" | Out-File -Encoding utf8 "$file.sha256"
              }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            user_mode_dist/Next_Tablet_Driver_Setup_x64.exe
            user_mode_dist/Next_Tablet_Driver_Setup_x64.exe.sha256
            user_mode_dist/Next_Tablet_Driver_Setup_arm64.exe
            user_mode_dist/Next_Tablet_Driver_Setup_arm64.exe.sha256

  build-linux:
    name: Build Linux AppImage and .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt

      - name: Ensure components
        run: |
          rustup component add rustfmt clippy || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev patchelf libfuse2 wget unzip dpkg-dev build-essential \
            libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev libatk1.0-dev \
            libx11-dev libxrandr-dev libxfixes-dev libxrender-dev libx11-xcb-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libxdo-dev

      - name: Build release (glibc)
        run: cargo build --workspace --release --all-features
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/next_tablet_driver AppDir/usr/bin/next_tablet_driver
          chmod +x AppDir/usr/bin/next_tablet_driver
          if [ -f resources/icon.png ]; then
            cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/next_tablet_driver.png
          fi
          printf '%s\n' '[Desktop Entry]' 'Name=NextTabletDriver' 'Exec=next_tablet_driver' 'Icon=next_tablet_driver' 'Type=Application' 'Categories=Utility;Graphics;' > AppDir/usr/share/applications/next_tablet_driver.desktop

      - name: Download linuxdeploy and plugin
        run: |
          curl -sL -o linuxdeploy-x86_64.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sL -o linuxdeploy-plugin-appimage-x86_64.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod a+x linuxdeploy-*.AppImage

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Embed update information pointing to GitHub Releases (zsync transport)
          LDAI_UPDATE_INFORMATION: "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|next_tablet_driver-*x86_64.AppImage.zsync"
          # Force output filename to include tag/version
          LDAI_OUTPUT: "next_tablet_driver-${{ github.event.inputs.ref_name || github.ref_name }}-x86_64.AppImage"
          LDAI_VERSION: "${{ github.event.inputs.ref_name || github.ref_name }}"
        run: |
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -d AppDir/usr/share/applications/next_tablet_driver.desktop -i AppDir/usr/share/icons/hicolor/256x256/apps/next_tablet_driver.png --output appimage || true
          APPIMAGE=$(ls -1 *.AppImage 2>/dev/null | grep -v linuxdeploy | head -n 1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage creation failed or no AppImage generated" && exit 1
          fi
          # The plugin should also generate a .zsync file when LDAI_UPDATE_INFORMATION is set
          ZSYNC=$(ls -1 *.zsync 2>/dev/null | head -n 1 || true)
          if [ -n "$ZSYNC" ]; then
            echo "Created zsync: $ZSYNC"
          else
            echo "Warning: zsync not generated"
          fi
          echo "Created AppImage: $APPIMAGE"

      - name: Create .deb package (wraps AppImage)
        run: |
          set -e
          APPIMAGE=$(ls -1 *.AppImage | grep -v linuxdeploy | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage not found, cannot build deb" && exit 1
          fi
          mkdir -p deb_pkg/DEBIAN
          mkdir -p deb_pkg/opt/next_tablet_driver
          mkdir -p deb_pkg/usr/bin

          cp "$APPIMAGE" deb_pkg/opt/next_tablet_driver/next_tablet_driver.AppImage
          chmod +x deb_pkg/opt/next_tablet_driver/next_tablet_driver.AppImage

          printf '%s\n' '#!/bin/sh' 'exec /opt/next_tablet_driver/next_tablet_driver.AppImage "$@"' > deb_pkg/usr/bin/next_tablet_driver
          chmod +x deb_pkg/usr/bin/next_tablet_driver

          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            VERSION=${GITHUB_SHA}
          fi

          printf '%s\n' "Package: next-tablet-driver" "Version: $VERSION" "Section: utils" "Priority: optional" "Architecture: amd64" "Maintainer: iSweat <iSweat-exe@users.noreply.github.com>" "Description: NextTabletDriver portable Linux AppImage" > deb_pkg/DEBIAN/control

          dpkg-deb --build deb_pkg next_tablet_driver_${VERSION}_amd64.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            *.AppImage
            *.zsync
            next_tablet_driver_*.deb

  build-linux-arm64:
    name: Build Linux ARM64 AppImage and .deb
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt

      - name: Ensure components
        run: |
          rustup component add rustfmt clippy || true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev patchelf libfuse2 wget unzip dpkg-dev build-essential \
            libgtk-3-dev libglib2.0-dev libgdk-pixbuf2.0-dev libpango1.0-dev libcairo2-dev libatk1.0-dev \
            libx11-dev libxrandr-dev libxfixes-dev libxrender-dev libx11-xcb-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev libxdo-dev

      - name: Build release (glibc arm64)
        run: cargo build --workspace --release --all-features
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/next_tablet_driver AppDir/usr/bin/next_tablet_driver
          chmod +x AppDir/usr/bin/next_tablet_driver
          if [ -f resources/icon.png ]; then
            cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/next_tablet_driver.png
          fi
          printf '%s\n' '[Desktop Entry]' 'Name=NextTabletDriver' 'Exec=next_tablet_driver' 'Icon=next_tablet_driver' 'Type=Application' 'Categories=Utility;Graphics;' > AppDir/usr/share/applications/next_tablet_driver.desktop

      - name: Download linuxdeploy and plugin
        run: |
          curl -sL -o linuxdeploy-aarch64.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage"
          curl -sL -o linuxdeploy-plugin-appimage-aarch64.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-aarch64.AppImage"
          chmod a+x linuxdeploy-*.AppImage

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Embed update information pointing to GitHub Releases (zsync transport)
          LDAI_UPDATE_INFORMATION: "gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|next_tablet_driver-*aarch64.AppImage.zsync"
          # Force output filename to include tag/version
          LDAI_OUTPUT: "next_tablet_driver-${{ github.event.inputs.ref_name || github.ref_name }}-aarch64.AppImage"
          LDAI_VERSION: "${{ github.event.inputs.ref_name || github.ref_name }}"
        run: |
          ./linuxdeploy-aarch64.AppImage --appdir AppDir -d AppDir/usr/share/applications/next_tablet_driver.desktop -i AppDir/usr/share/icons/hicolor/256x256/apps/next_tablet_driver.png --output appimage || true
          APPIMAGE=$(ls -1 *.AppImage 2>/dev/null | grep -v linuxdeploy | head -n 1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage creation failed or no AppImage generated" && exit 1
          fi
          # The plugin should also generate a .zsync file when LDAI_UPDATE_INFORMATION is set
          ZSYNC=$(ls -1 *.zsync 2>/dev/null | head -n 1 || true)
          if [ -n "$ZSYNC" ]; then
            echo "Created zsync: $ZSYNC"
          else
            echo "Warning: zsync not generated"
          fi
          echo "Created AppImage: $APPIMAGE"

      - name: Create .deb package (wraps AppImage)
        run: |
          set -e
          APPIMAGE=$(ls -1 *.AppImage | grep -v linuxdeploy | head -n 1)
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage not found, cannot build deb" && exit 1
          fi
          mkdir -p deb_pkg/DEBIAN
          mkdir -p deb_pkg/opt/next_tablet_driver
          mkdir -p deb_pkg/usr/bin

          cp "$APPIMAGE" deb_pkg/opt/next_tablet_driver/next_tablet_driver.AppImage
          chmod +x deb_pkg/opt/next_tablet_driver/next_tablet_driver.AppImage

          printf '%s\n' '#!/bin/sh' 'exec /opt/next_tablet_driver/next_tablet_driver.AppImage "$@"' > deb_pkg/usr/bin/next_tablet_driver
          chmod +x deb_pkg/usr/bin/next_tablet_driver

          VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1 | tr -d '\r')
          if [ -z "$VERSION" ]; then
            VERSION=${GITHUB_SHA}
          fi

          printf '%s\n' "Package: next-tablet-driver" "Version: $VERSION" "Section: utils" "Priority: optional" "Architecture: arm64" "Maintainer: iSweat <iSweat-exe@users.noreply.github.com>" "Description: NextTabletDriver portable Linux AppImage" > deb_pkg/DEBIAN/control

          dpkg-deb --build deb_pkg next_tablet_driver_${VERSION}_arm64.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-release
          path: |
            *.AppImage
            *.zsync
            next_tablet_driver_*.deb

  build-musl:
    name: Build MUSL (best-effort)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: clippy,rustfmt

      - name: Ensure components
        run: |
          rustup component add rustfmt clippy || true

      - name: Install musl build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools build-essential pkg-config libssl-dev curl libxdo-dev libudev-dev

      - name: Add MUSL target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Attempt MUSL build (best-effort)
        run: |
          set -x
          cargo build --target x86_64-unknown-linux-musl --release --workspace --all-features || true
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      - id: package
        name: Package MUSL binary (or placeholder)
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/next_tablet_driver
          mkdir -p musl_upload
          if [ -f "$BIN" ]; then
            cp "$BIN" musl_upload/next_tablet_driver
            chmod +x musl_upload/next_tablet_driver
            tar -czf musl_upload/next_tablet_driver-linux-musl-${{ github.event.inputs.ref_name || github.ref_name }}.tar.gz -C musl_upload next_tablet_driver
            echo "created=true" >> $GITHUB_OUTPUT
          else
            echo "MUSL build not available" > musl_upload/musl_not_built.txt
            echo "created=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload MUSL artifact
        uses: actions/upload-artifact@v4
        with:
          name: musl-release
          path: musl_upload/*

  publish-release:
    name: Publish Release
    needs: [build-windows, build-linux, build-linux-arm64, build-musl]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: downloaded_artifacts/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: downloaded_artifacts/linux

      - name: Download Linux ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-release
          path: downloaded_artifacts/linux-arm64

      - name: Download MUSL artifacts (if any)
        uses: actions/download-artifact@v4
        with:
          name: musl-release
          path: downloaded_artifacts/musl
        if: always()

      - name: Collect artifacts list
        id: collect
        run: |
          # Exclude placeholder marker files (e.g., musl_not_built.txt)
          find downloaded_artifacts -type f ! -name 'musl_not_built.txt' > files.txt
          echo "files<<EOF" >> $GITHUB_OUTPUT
          cat files.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with artifacts
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.ref_name || github.ref_name }}
          name: Release ${{ github.event.inputs.ref_name || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.collect.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
