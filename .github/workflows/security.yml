name: Security

# Advisories are checked here and not in ci.yml: a newly published advisory must not fail
# unrelated pull requests. Runs weekly, on demand and when a lockfile or the policy changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "**/Cargo.lock"
      - "deny.toml"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - "deny.toml"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: Security advisories (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # One workspace, one lockfile: a single run audits every crate.
      - name: Check every crate
        run: cargo deny check advisories
