name: "✨ Feature Request"
description: "Propose a new feature, enhancement, or idea"
title: "[Feature] "
labels: ["✨ Feature", "⏳ Todo"]
body:
  - type: markdown
    attributes:
      value: |
        ## Suggest a new feature! ✨
        We love new ideas. Please fill out the template below to explain your proposal.
  - type: checkboxes
    id: checks
    attributes:
      label: "Before requesting..."
      options:
        - label: "I have searched the existing issues to ensure this feature hasn't been requested already."
          required: true
  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem? Please describe."
      description: "A clear and concise description of what the problem is. Ex. I'm always frustrated when..."
      placeholder: "I find it difficult to..."
  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "A clear and concise description of what you want to happen."
      placeholder: "I would like a button that..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternative Solutions"
      description: "Have you considered any alternative solutions or workarounds?"
  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Add any other context, mockups, or screenshots about the feature request here."