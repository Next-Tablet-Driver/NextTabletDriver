name: "Tablet Support Request"
description: "Request support for a new tablet model that isn't working yet"
title: "[Tablet Support] "
labels: ["Tablet Support"]
body:
  - type: markdown
    attributes:
      value: |
        ## Request Support for a New Tablet
        To add support for a new tablet, we need its name, its USB ID and, if you can, a few raw reports.
        The guide "Adding a tablet" in the `docs` folder shows how to find them, and how to add support yourself.
  - type: input
    id: tablet_model
    attributes:
      label: "Tablet Model"
      description: "The exact brand and model of your tablet."
      placeholder: "e.g., XP-Pen Deco 01 V2"
    validations:
      required: true
  - type: input
    id: vid_pid
    attributes:
      label: "Vendor ID (VID) and Product ID (PID)"
      description: "You can find this in the Device Manager (Windows) or using `lsusb` (Linux)."
      placeholder: "e.g., 0x28BD:0x0914"
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: "Capture (.ntdcap)"
      description: |
        Record your tablet with `ntd-recorder` (see the "Adding a tablet" guide in `docs`) and drag the `.ntdcap` file here. It holds no personal data. Without it, we can only guess at your tablet's reports.
      placeholder: "Drag and drop the .ntdcap file here"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Additional Information"
      description: "Does the tablet work partially? Does it have a screen? Any buttons or dials?"
      placeholder: "The pen works but buttons are not recognized..."
