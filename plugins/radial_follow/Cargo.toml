[package]
name = "radial_follow"
version = "1.0.0"
publish = false
edition = "2024"
authors = ["AbstractQbit <https://github.com/AbstractQbit>"]
description = "Radial Follow Smoothing plugin (created by AbstractQbit)"

[lib]
crate-type = ["cdylib"]

[dependencies]
ntd_plugin_api = { path = "../../sdk/plugin_api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Same policy as the root crate and `sdk/plugin_api` (copied: each plugin is its own crate with
# its own lockfile, so it cannot share a workspace table).
[lints.rust]
dead_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
lossy_float_literal = "deny"

all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
