[package]
name = "kalman_smoothing"
version = "1.0.0"
publish = false
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
description = "Kalman Filter Smoothing Plugin for NextTabletDriver"

[lib]
crate-type = ["cdylib"]

[dependencies]
ntd_plugin_api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Same policy as the root crate and `crates/ntd-plugin-api` (copied until the shared
# `[workspace.lints]` table exists, roadmap P1.6).
[lints.rust]
dead_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
lossy_float_literal = "deny"

all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
