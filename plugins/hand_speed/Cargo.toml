[package]
name = "hand_speed"
version = "1.0.0"
publish = false
edition = "2024"
authors = ["nzbasic <https://github.com/nzbasic>"]
description = "Hand Speed & Travel Distance Tracker with WebSocket Broadcast"

[lib]
crate-type = ["cdylib"]

[dependencies]
ntd_plugin_api = { path = "../../sdk/plugin_api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5.15"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
