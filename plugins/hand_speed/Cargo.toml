[package]
name = "hand_speed"
version = "1.0.0"
publish = false
edition = "2024"
authors = ["nzbasic <https://github.com/nzbasic>"]
description = "Hand Speed & Travel Distance Tracker with WebSocket Broadcast"

[lib]
crate-type = ["cdylib"]

[dependencies]
ntd_plugin_api = { path = "../../crates/ntd-plugin-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5.15"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }

# Same policy as the root crate and `crates/ntd-plugin-api` (copied until the shared
# `[workspace.lints]` table exists, roadmap P1.6).
[lints.rust]
dead_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
exit = "deny"
todo = "deny"
unimplemented = "deny"
lossy_float_literal = "deny"

all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_panics_doc = "warn"
missing_errors_doc = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
too_many_lines = "allow"
